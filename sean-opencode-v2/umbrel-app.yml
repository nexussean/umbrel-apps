manifestVersion: 1
id: sean-opencode-v2
category: ai
name: OpenCode V2
version: "2.0.22"
tagline: AI coding server for OpenCode V2 clients
description: >-
  OpenCode 2.0.22 with persistent storage and a password-protected desktop API.
  Use the password displayed by Umbrel to sign in to the web interface or connect
  OpenCode Desktop. For desktop connections use your Umbrel server address with
  port 4097, for example http://YOUR-UMBREL-TAILSCALE-IP:4097.


  This app starts with separate data from the official OpenCode V1 app.
  Configure your model providers and projects after installation.
releaseNotes: ""
developer: Anomaly
website: https://opencode.ai/
dependencies: []
repo: https://github.com/anomalyco/opencode
support: https://github.com/anomalyco/opencode/issues
port: 4098
gallery: []
path: ""
defaultUsername: opencode
defaultPassword: ""
deterministicPassword: true
submitter: Sean
submission: ""
storage:
  dataRoot: data
icon: https://raw.githubusercontent.com/nexussean/umbrel-apps/main/sean-opencode-v2/icon.svg
